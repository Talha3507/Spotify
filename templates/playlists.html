<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Çalma Listeleri</title>

    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body{
            background:#121212;
            color:white;
            font-family:sans-serif;
        }

        .playlist-list{
            list-style:none;
            padding:0;
        }

        .playlist-item{
            margin:15px 0;
            background:#1e1e1e;
            padding:15px;
            border-radius:12px;
        }

        .playlist-item a{
            display:flex;
            align-items:center;
            gap:15px;
            text-decoration:none;
            color:white;
        }

        .playlist-item img{
            width:70px;
            height:70px;
            border-radius:10px;
            object-fit:cover;
        }

        .playlist-info{
            display:flex;
            flex-direction:column;
        }

        .track-count{
            color:#b3b3b3;
            margin-top:4px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="profile">
        {% if profile.image %}
            <img src="{{ profile.image }}" width="80">
        {% endif %}

        <div>
            <h2>{{ profile.name }}</h2>

            {% if profile.product == "premium" %}
                <span style="color:#1db954;">🎵 Premium</span>
            {% else %}
                <span style="color:gray;">🎧 Free</span>
            {% endif %}
        </div>
    </div>

    <h1>Çalma Listelerim</h1>

    <ul class="playlist-list">

        {% for playlist in playlists %}
        <li class="playlist-item">
            <a href="{{ playlist.url }}" target="_blank">

                {% if playlist.image %}
                    <img src="{{ playlist.image }}" alt="{{ playlist.name }}">
                {% endif %}

                <div class="playlist-info">
                    <strong>{{ playlist.name }}</strong>
                    <span class="track-count">
                        {{ playlist.tracks }} şarkı
                    </span>
                </div>

            </a>
        </li>
        {% endfor %}

    </ul>

</div>

</body>
</html>
